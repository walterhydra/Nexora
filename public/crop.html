<!DOCTYPE html>
<html>
<head>
  <title>Crop Image</title>
</head>
<body>
  <h1>Cropping Image...</h1>
  <canvas id="canvas" style="border: 1px solid red;"></canvas>
  <div id="status" style="font-family: monospace; font-size: 16px; margin-top: 20px; color: #fff; background: #333; padding: 10px;">Loading image...</div>

  <script>
    const img = new Image();
    img.src = '/projects/image copy.png';
    img.onload = function() {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const status = document.getElementById('status');
      status.innerText = 'Analyzing pixels...';

      const imageData = ctx.getImageData(0, 0, img.width, img.height);
      const data = imageData.data;

      // Scan from the bottom row upwards to find the first non-black line
      let cropHeight = img.height;
      for (let y = img.height - 1; y >= 0; y--) {
        let isRowBlack = true;
        for (let x = 0; x < img.width; x++) {
          const idx = (y * img.width + x) * 4;
          const r = data[idx];
          const g = data[idx+1];
          const b = data[idx+2];
          // If any pixel in the row is not black/very dark
          if (r > 15 || g > 15 || b > 15) {
            isRowBlack = false;
            break;
          }
        }
        if (!isRowBlack) {
          // Keep a tiny margin of 2px just in case, but crop the main black region
          cropHeight = y + 1;
          break;
        }
      }

      status.innerText = `Detected crop height: ${cropHeight}px (removed ${img.height - cropHeight}px of black bar). Cropping...`;

      // Create cropped canvas
      const croppedCanvas = document.createElement('canvas');
      croppedCanvas.width = img.width;
      croppedCanvas.height = cropHeight;
      const croppedCtx = croppedCanvas.getContext('2d');
      croppedCtx.drawImage(img, 0, 0, img.width, cropHeight, 0, 0, img.width, cropHeight);

      const croppedDataUrl = croppedCanvas.toDataURL('image/png');

      // Send to server
      status.innerText = 'Sending cropped image to node server...';
      fetch('http://localhost:9999/save', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ image: croppedDataUrl })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          status.innerText = 'DONE! Image successfully cropped and overwritten!';
          document.title = 'CROPPING_SUCCESS';
        } else {
          status.innerText = 'Error: ' + data.error;
        }
      })
      .catch(err => {
        status.innerText = 'Network error: ' + err.message;
      });
    };
  </script>
</body>
</html>
